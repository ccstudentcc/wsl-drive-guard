# Default system-layer config for WSL Drive Guard.

WSL_GUARD_MANAGED_DRIVES="${WSL_GUARD_MANAGED_DRIVES:-c d e}"
WSL_GUARD_MOUNT_ROOT="${WSL_GUARD_MOUNT_ROOT:-/mnt}"
WSL_GUARD_DEFAULT_MODE="${WSL_GUARD_DEFAULT_MODE:-ro}"
WSL_GUARD_AUTOMOUNT_OPTIONS="${WSL_GUARD_AUTOMOUNT_OPTIONS:-metadata,umask=22,fmask=11}"
WSL_GUARD_DRVFS_OPTIONS="${WSL_GUARD_DRVFS_OPTIONS:-noatime,metadata,umask=22,fmask=11}"

WSL_GUARD_SYSTEM_BIN_DIR="${WSL_GUARD_SYSTEM_BIN_DIR:-/usr/local/bin}"
WSL_GUARD_SYSTEM_CONFIG_DIR="${WSL_GUARD_SYSTEM_CONFIG_DIR:-/etc/wsl-drive-guard}"
WSL_GUARD_SYSTEM_CONFIG_PATH="${WSL_GUARD_SYSTEM_CONFIG_PATH:-${WSL_GUARD_SYSTEM_CONFIG_DIR}/system.conf}"

WSL_GUARD_WSL_CONF_PATH="${WSL_GUARD_WSL_CONF_PATH:-/etc/wsl.conf}"
WSL_GUARD_FSTAB_PATH="${WSL_GUARD_FSTAB_PATH:-/etc/fstab}"
WSL_GUARD_BACKUP_ROOT_PARENT="${WSL_GUARD_BACKUP_ROOT_PARENT:-/etc/wsl-isolation-backups}"

WSL_GUARD_MANAGED_BEGIN="${WSL_GUARD_MANAGED_BEGIN:-# BEGIN WSL ISOLATION MANAGED BLOCK}"
WSL_GUARD_MANAGED_END="${WSL_GUARD_MANAGED_END:-# END WSL ISOLATION MANAGED BLOCK}"
