# Default user-layer config for WSL Drive Guard.

WSL_GUARD_ENABLE_PROMPT="${WSL_GUARD_ENABLE_PROMPT:-1}"
WSL_GUARD_ENABLE_SESSION_MARKER="${WSL_GUARD_ENABLE_SESSION_MARKER:-1}"
WSL_GUARD_ENABLE_COPY_MOVE_CONFIRM="${WSL_GUARD_ENABLE_COPY_MOVE_CONFIRM:-1}"
WSL_GUARD_ENABLE_SAFE_RM="${WSL_GUARD_ENABLE_SAFE_RM:-1}"

WSL_GUARD_WINDOWS_MOUNT_ROOT="${WSL_GUARD_WINDOWS_MOUNT_ROOT:-/mnt}"
WSL_GUARD_TRASH_ROOT="${WSL_GUARD_TRASH_ROOT:-${XDG_DATA_HOME:-$HOME/.local/share}/Trash}"

WSL_GUARD_USER_CONFIG_DIR="${WSL_GUARD_USER_CONFIG_DIR:-${XDG_CONFIG_HOME:-${HOME}/.config}/wsl-drive-guard}"
WSL_GUARD_USER_CONFIG_PATH="${WSL_GUARD_USER_CONFIG_PATH:-${WSL_GUARD_USER_CONFIG_DIR}/user.conf}"
WSL_GUARD_USER_LIB_DIR="${WSL_GUARD_USER_LIB_DIR:-${WSL_GUARD_USER_CONFIG_DIR}/lib}"
WSL_GUARD_USER_BASHRC_D="${WSL_GUARD_USER_BASHRC_D:-${HOME}/.bashrc.d}"
WSL_GUARD_USER_ZSHRC_D="${WSL_GUARD_USER_ZSHRC_D:-${HOME}/.zshrc.d}"
WSL_GUARD_USER_BIN_DIR="${WSL_GUARD_USER_BIN_DIR:-${HOME}/.local/bin}"
